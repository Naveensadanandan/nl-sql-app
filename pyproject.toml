[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nlsql"
version = "0.1.0"
description = "Natural-language to SQL agent with value resolution and a grounded business glossary"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "langsmith>=0.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.13",
    "sqlglot>=25.0",
    "pandas>=2.2",
    "elasticsearch[async]>=8.15,<9",
    "qdrant-client[fastembed]>=1.11",
    "pint>=0.24",
    "arq>=0.26",
    "redis>=5.0",
    "cryptography>=43.0",
    "structlog>=24.4",
    "prometheus-client>=0.20",
    "streamlit>=1.38",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
    "langgraph-cli[inmem]>=0.1",
    "locust>=2.31",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "ASYNC"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: needs docker compose services"]
